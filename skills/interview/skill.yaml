name: interview
description: 'Interview the user before a pipeline stage (PRD, Architecture, TechSpec, Tasks) or across the whole constitution (Realign) to surface ambiguities and drift between specs and code. Owns the open-decisions register: each deferred question gets options, a recommendation, and a closure path, closed by a spike or design review. Use before a stage, to realign, or on /interview. Requires subagent dispatch and web access.'
