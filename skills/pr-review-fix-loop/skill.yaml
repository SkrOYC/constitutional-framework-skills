skillprism: '1'
name: pr-review-fix-loop
description: "Run an autonomous post-PR review loop by repeatedly spawning an isolated subagent with the reviewing-pull-requests skill, waiting for the review, fixing valid findings locally, committing and pushing the fixes, and repeating until two consecutive review rounds find no high-priority bugs. Use after a PR already exists and the user wants ongoing self-review rounds without supervising each pass. Requires subagent spawning plus `git` and `gh` CLI access. Do not use before a PR exists, for one-off PR reviews with no code changes, or for manual review workflows where the user wants to inspect every round before fixes are pushed."
metadata:
  family: "ai-project-constitutional-framework"
  role: "execution"
  artifact: "source-code | git-history"
  upstream: "github-pull-request"
