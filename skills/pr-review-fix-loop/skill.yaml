skillprism: '1'
name: pr-review-fix-loop
description: 'Run an autonomous post-PR review loop that converges. Round one is a panel of isolated reviewers on different model families running reviewing-pull-requests in parallel; triage each finding into Act on, Consider, Noted, or Dismissed, have a fix worker address the Act-on findings, then run scoped verification rounds until none finds a new Act-on finding. Use once a PR exists. Requires subagent dispatch, git, and gh.'
