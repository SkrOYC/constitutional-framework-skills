name: execute-epic-end-to-end
description: "Execute a planned work item end to end — a constitution epic (default) or a tracked GitHub issue — by planning milestones once up front, creating a branch, implementing, validating, committing, and independently reviewing each milestone before continuing, then closing out with a constitutional reconciliation that keeps .constitution/ aligned. Defaults to the active epic under .constitution/tasks/active/; auto-switches to GitHub Issue mode when the user references a gh issue (number/URL) or no active epic exists."
