skillprism: '1'
name: execute-epic-end-to-end
description: 'Execute one epic end to end as the epic lead, standalone or under execute-wave, asking nothing after step 0. Plan once, then dispatch worker and reviewer subagents per milestone, verify and commit, close out the epic file, open the pull request, and run the review loop to review-clean; standalone, also merge and reconcile. A referenced GitHub issue becomes a fast-lane fix or a Stage 4 out-of-band epic. Use for a planned epic or tracked issue; not for throwaway changes.'
metadata:
  family: 'ai-project-development-framework'
  stage: 'execution'
  artifact: 'an epic plan file when standalone | milestone commits | the epic file''s status, deviations, decisions, and closeout | a review-clean pull request'
  upstream: '.constitution/tasks/ | .constitution/tech-spec/ | .constitution/architecture/ | .constitution/prd/ | an epic plan file'
